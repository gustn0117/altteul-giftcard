<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 130" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="goldL" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FCEAA8"/>
      <stop offset="30%" stop-color="#EFCB6E"/>
      <stop offset="65%" stop-color="#C9962F"/>
      <stop offset="100%" stop-color="#8B6914"/>
