<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A4DA8"/>
      <stop offset="100%" stop-color="#0F2858"/>
    </linearGradient>
  </defs>

  <!-- Pre-order 메인 텍스트 (네이비 그라디언트) -->
  <text x="260" y="118" text-anchor="middle"
        font-family="'Helvetica Neue', 'Arial Black', sans-serif" font-weight="900"
        font-size="100" fill="url(#navyGrad)" letter-spacing="-3">Pre-order</text>

  <!-- 'o' 안 가운데 점 (Pre-order의 o) — 오렌지 강조점 -->
  <circle cx="234" cy="92" r="5" fill="#F97316"/>

  <!-- 'd' 위쪽 화살표 (오렌지, 우상향) -->
  <g stroke="#F97316" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="370" y1="58" x2="408" y2="22"/>
    <polyline points="388,18 408,22 404,42"/>
  </g>

  <!-- 가운데 구분점 -->
  <circle cx="260" cy="170" r="4" fill="#F97316"/>

  <!-- 양옆 짧은 선 (─ 예 판 상 품 권 ─) -->
  <line x1="118" y1="200" x2="158" y2="200" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="362" y1="200" x2="402" y2="200" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 한글 서브 — 예 판 상 품 권 -->
  <text x="260" y="212" text-anchor="middle"
        font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif" font-weight="700"
        font-size="38" fill="#525252" letter-spacing="13">예 판 상 품 권</text>
</svg>
